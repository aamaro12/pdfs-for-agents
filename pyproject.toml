[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfscope"
version = "0.3.0"
description = "Read PDFs in steps, as an analyst does, with every figure cited to its page and box."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alessandro Amaro"}]
readme = "README.md"
dependencies = ["pypdfium2>=5,<6", "pillow>=10"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
figures = ["mlx-vlm>=0.7.8,<0.8; sys_platform == 'darwin' and platform_machine == 'arm64'"]
test = ["reportlab>=4"]

[project.scripts]
pdfscope = "pdfscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdfscope = ["vision.swift"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
