name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install '.[mcp,test]' ruff==0.17.0
      - name: Lint and format
        run: |
          ruff check src tests bench examples
          ruff format --check src tests bench examples
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Command line
        run: |
          pdfscope outline examples/northwind.pdf
          pdfscope find examples/northwind.pdf 1.3m
